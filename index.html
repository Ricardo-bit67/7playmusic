<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador de Louvores - Personalizável</title>
    <style>
        :root { --primary: #1DB954; --bg: #121212; --card: #1e1e1e; --text-dim: #cccccc; }
        
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; font-size: 1.2rem; }

        /* MODAL DE INSTRUÇÕES */
        #instrucoes-tela { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-instrucoes { background: var(--card); padding: 40px; border-radius: 25px; max-width: 500px; width: 90%; text-align: center; border: 2px solid var(--primary); }
        .btn-entrar { background: var(--primary); color: white; border: none; padding: 20px 50px; border-radius: 40px; font-weight: bold; cursor: pointer; font-size: 1.5rem; margin-top: 20px; width: 100%; }

        .container { width: 100%; max-width: 700px; }
        .card { background: var(--card); padding: 30px; border-radius: 25px; margin-bottom: 35px; text-align: center; }
        h1 { font-size: 2rem; color: var(--primary); margin-bottom: 15px; }

        /* LISTA DE SORTEIO */
        .musica-item { 
            display: flex; justify-content: space-between; align-items: center;
            background: #282828; margin: 15px 0; padding: 20px; border-radius: 18px; 
            text-decoration: none; color: white; border-left: 8px solid var(--primary);
        }
        .info-musica { flex-grow: 1; text-decoration: none; color: white; text-align: left; cursor: pointer; }
        .musica-nome { font-weight: bold; font-size: 1.3rem; display: block; }
        .album-tag { font-size: 0.9rem; color: var(--primary); text-transform: uppercase; }

        /* CAMPO DE BUSCA */
        .search-box { width: 100%; padding: 20px; border-radius: 15px; border: 2px solid #444; background: #282828; color: white; font-size: 1.4rem; margin-bottom: 20px; box-sizing: border-box; }
        
        /* BOTÃO DE ADICIONAR NA LISTA */
        .btn-add { background: #333; color: var(--primary); border: 1px solid var(--primary); padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-left: 10px; font-size: 1rem; }
        .btn-add:hover { background: var(--primary); color: white; }

        .btn-acao { background: var(--primary); color: white; border: none; padding: 22px; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 1.4rem; width: 100%; }
        .posicao { color: #888; margin-right: 10px; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>

<div id="instrucoes-tela">

        <ul style="text-align: left; list-style: none; padding: 0;">
            <li style="margin-bottom: 15px;">✅ <b>Sortear:</b> Gera 7 músicas aleatórias.</li>
            <li style="margin-bottom: 15px;">✅ <b>Trocar:</b> Pesquise uma música e clique no botão <b>[ + ]</b> para colocá-la na lista de cima.</li>
            <li style="margin-bottom: 15px;">✅ <b>Ouvir:</b> Toque no nome da música para abrir o vídeo.</li>

        <button class="btn-entrar" onclick="fecharInstrucoes()">ENTENDI!</button>

</div>

        const query = encodeURIComponent(nome + " " + album);

    function renderizarLista() {
        const container = document.getElementById('lista-sorteada');
        container.innerHTML = "";

    }

    function substituirMusica(nomeNovo, albumNovo) {

    }

    function filtrarMusicas() {
        const termo = document.getElementById('inputBusca').value.toLowerCase();
        const listaUI = document.getElementById('listaGeral');
        listaUI.innerHTML = "";
        if(termo.length < 2) return;
        const filtradas = todasMusicasGeral.filter(m => m.nome.toLowerCase().includes(termo)).slice(0, 10);
        
        filtradas.forEach(m => {
            listaUI.innerHTML += `
                <div class="musica-item" style="border-left: 8px solid #555;">
                    <div class="info-musica" onclick="abrirNoYoutube('${m.nome}', '${m.album}')">
                        <span class="musica-nome">${m.nome}</span>
                        <span class="album-tag">${m.album}</span>
                    </div>
                    <button class="btn-add" onclick="substituirMusica('${m.nome}', '${m.album}')"> + </button>
                </div>`;
        });
    }

    gerarSorteio();
</script>

</body>
</html>
